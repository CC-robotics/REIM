benchmark: MT10
model_seed: 42
observation_schema: raw39_plus_official_task_one_hot
task_count: 10
state_dim: 49
action_dim: 4
max_episode_steps: 500

# Meta-World MT benchmarks contain known task families rather than an unseen
# task split. Independently generated banks are kept separate and their task
# payload hashes are checked for overlap; they are not called an official test
# split.
banks:
  demonstrations: 20261010
  failure_training: 20262010
  recovery_training: 20263010
  validation: 20264010
  final_evaluation: 20265010

data:
  demonstrations_per_task: 50
  failure_rollouts_per_task: 50
  validation_rollouts_per_task: 20
  recovery_rollouts_per_task: 50
  recovery_max_attempts_multiplier: 20
  max_attempts_per_success: 5

failure_labels:
  sequence_length: 10
  prediction_horizon: 10
  calibration_mode: task_conditional_quantile
  calibration_quantile: 0.90
  # Kept only in the immutable raw collection as a diagnostic event trace.
  # Detector training uses the calibrated task-specific thresholds above.
  expert_action_disagreement_l1: 0.35
  terminal_positive_horizon: 25

disturbance:
  levels: [0.0, 0.1, 0.2, 0.3, 0.4]
  action_std_scale: 0.40
  observation_std_scale: 0.025
  # Universal action/observation noise is used for all task families.  The
  # PickPlace-only object teleportation is deliberately disabled.
  object_position_noise: false

recovery:
  collection_threshold: 0.20
  deployment_threshold: 0.30
  release_threshold: 0.05
  release_patience: 10
  min_recovery_steps: 5
  intervention_cooldown: 10
  max_consecutive_steps_within_episode: 250

evaluation:
  episodes_per_task: 50
  clean_methods: [mlp_bc, act, heuristic_recovery, reim]
  disturbed_methods: [mlp_bc, act, heuristic_recovery, reim]
  appendix_reset_baseline: [act_retry]
  terminate_on_success: true
  total_episode_horizon: 500
  paired_common_random_numbers: true
  primary_metric: task_macro_success
