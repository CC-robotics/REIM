seed: 42
device: cpu
checkpoint: checkpoints/smoke/recovery_policy.zip
checkpoint_dir: checkpoints/smoke/ppo
tensorboard_log: results/smoke/logs/ppo
monitor_dir: results/smoke/logs/ppo_monitor
curve_path: results/smoke/figures/recovery_training_curve.png
metrics_path: results/smoke/tables/recovery_metrics.json

training:
  total_timesteps: 512
  learning_rate: 0.0003
  n_steps: 64
  batch_size: 32
  n_epochs: 2
  n_envs: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  checkpoint_freq: 256
  eval_freq: 256
  eval_episodes: 2
  progress_bar: false

reward:
  task_success: 10.0
  successful_recovery: 5.0
  terminal_failure: -10.0
  time_penalty: -0.01
  distance_progress_scale: 2.0

recovery:
  initialize_with_failure_states: true
  max_recovery_steps: 24
  recovered_distance: 0.08
  warmup_min_steps: 8
  warmup_max_steps: 18
  relift_height: 0.03
