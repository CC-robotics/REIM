seed: 42
device: cpu
data_dir: datasets/smoke/demonstrations
checkpoint: checkpoints/smoke/bc_policy.pt
latest_checkpoint: checkpoints/smoke/bc_policy_latest.pt
curve_path: results/smoke/figures/act_training_curve.png
history_path: results/smoke/tables/act_training_history.csv
summary_path: results/smoke/tables/bc_training_summary.json

model:
  policy_type: ACT
  chunk_size: 8
  hidden_dim: 64
  n_heads: 4
  encoder_layers: 1
  decoder_layers: 1
  dim_feedforward: 128
  latent_dim: 8
  dropout: 0.1
  temporal_ensemble: true
  ensemble_decay: 0.05

training:
  epochs: 5
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  validation_fraction: 0.2
  num_workers: 0
  patience: 0
  checkpoint_every: 1
  grad_clip_norm: 5.0
  reconstruction_loss: l1
  kl_weight: 1.0
